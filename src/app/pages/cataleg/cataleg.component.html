<app-formulari-cerca></app-formulari-cerca>

<div *ngIf="carregant()">
  <p>Carregant...</p>
</div>

<div *ngIf="error()">
  <p>{{ error() }}</p>
  <button (click)="reintentar()">Reintentar</button>
</div>

<cdk-virtual-scroll-viewport itemSize="120" style="height: 500px">
  <div *cdkVirtualFor="let e of elements()">
    <app-targeta-element [element]="e"></app-targeta-element>
  </div>
</cdk-virtual-scroll-viewport>
