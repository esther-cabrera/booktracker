<app-formulari-cerca></app-formulari-cerca>

<div *ngIf="carregant()">
  <p>Carregant...</p>
</div>

<div *ngIf="error()">
  <p>{{ error() }}</p>
  <button (click)="reintentar()">Reintentar</button>
</div>

<div *ngIf="!carregant() && !error()">
  <app-targeta-element *ngFor="let e of elements()" [element]="e">
  </app-targeta-element>
</div>
